name: Build CraftoLand Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Capacitor project configuration
        run: |
          cat > package.json <<'EOF'
          {
            "name": "craftoland-android",
            "version": "1.0.0",
            "private": true,
            "description": "Offline Android wrapper for CraftoLand",
            "scripts": {
              "build": "node scripts/prepare-web.js",
              "android:sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/android": "^6.2.1",
              "@capacitor/cli": "^6.2.1",
              "@capacitor/core": "^6.2.1"
            },
            "devDependencies": {}
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.anishenterprises.craftoland",
            "appName": "CraftoLand",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          mkdir -p scripts www
          cat > scripts/prepare-web.js <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const source = path.join(process.cwd(), 'index.html');
          const destDir = path.join(process.cwd(), 'www');
          if (!fs.existsSync(source)) {
            console.error('Expected index.html in repository root.');
            process.exit(1);
          }
          fs.mkdirSync(destDir, { recursive: true });
          fs.copyFileSync(source, path.join(destDir, 'index.html'));
          console.log('Prepared bundled CraftoLand HTML.');
          EOF
          npm install
          npm run build
          npx cap add android

      - name: Synchronize local app assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftoLand-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30